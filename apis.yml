description: 'Hatcheri (Hatcheri Foods) is a food-focused incubator-accelerator based in San Leandro,
  California that partners with emerging food and beverage brands to build and scale them. Founded in 2013,
  it operates through three arms: Hatcheri Brands (leading day-to-day operations alongside founders),
  Hatcheri Advisory Services (hands-on strategic support across supply chain, marketing, sales, financial
  management, food safety, and product innovation), and Hatcheri Capital (investment and funding partnerships).
  Portfolio and partner brands include Sonoma Gourmet, Snapdragon, Fra'' Mani, Sukhi''s, and Sonoma Specialty
  Foods. Backed by Norwest Venture Partners. Hatcheri publishes no public developer API, SDKs, or technical
  documentation; this profile is a company/provider identity record in the API Evangelist network.'
